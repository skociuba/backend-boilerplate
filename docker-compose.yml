# Domyślnie Docker trzyma logi kontenera w jednym pliku bez limitu — przy
# jednej linii JSON na żądanie (pino-http) w końcu zapełniłby dysk, a
# razem z nim padłaby baza. 3 pliki po 10 MB na kontener, najstarszy
# kasowany.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15    # jest gotowy image z dockerhub
    # Bez polityki restartu kontener po restarcie serwera (albo demona
    # Dockera) zostaje zatrzymany i strona leży, aż ktoś ręcznie zrobi `up`.
    # unless-stopped, nie always: ręczne `docker compose stop` jest
    # szanowane także po restarcie.
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}           # wartości czytane z pliku .env (nie commitujemy haseł do repo)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data        # prawe strony na sztywno
      # Ta gałąź zarządza schematem przez Prisma (prisma/schema.prisma +
      # `npx prisma db pull`/`migrate dev`), nie przez initdb.d — initdb.d
      # wykonuje się tylko raz, przy pierwszym starcie na pustym wolumenie,
      # więc nie nadaje się do wprowadzania kolejnych zmian schematu.
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}   # czeka aż postgres faktycznie akceptuje połączenia, nie tylko że kontener się uruchomił
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # ${IMAGE_TAG:-latest} — deploy (.github/workflows/deploy.yml) i
    # rollback (scripts/rollback.sh) podają IMAGE_TAG=X.Y.Z na czas
    # polecenia, nic się tu nie zapisuje trwale. :latest przesuwa tylko
    # release.yml przy wydaniu, więc ręczne `docker compose up` bez
    # IMAGE_TAG też trafi w ostatnie wydanie, a nie w ostatni merge.
    image: sebastiankociuba/node-backend:${IMAGE_TAG:-latest}   # obraz z Docker Hub, budowany przez GitHub Actions
    restart: unless-stopped   # jw. przy db
    logging: *logging
    # .env nie jedzie w obrazie (.dockerignore), a samo ${...} niżej tylko
    # podstawia wartości do TEGO pliku — bez env_file JWT_*, SMTP_* i
    # FRONTEND_URL nie docierają do kontenera i logowanie wywala się na
    # jwt.sign ("secretOrPrivateKey must have a value"). DATABASE_URL z
    # environment ma pierwszeństwo nad env_file, więc lokalny localhost:5433
    # z .env nie nadpisze adresu db:5432.
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"   # db to nazwa serwisu powyżej
      # Wersja w zgłoszeniach Sentry (src/instrument.ts) = wdrażany obraz.
      # Sam SENTRY_DSN przychodzi z .env na serwerze.
      SENTRY_RELEASE: "${IMAGE_TAG:-latest}"
    # lewa: adres:port na hoście/VPS, prawa: port wewnątrz kontenera.
    # 127.0.0.1 = dostęp tylko z samego serwera (nginx, /api-node). Docker
    # sam dopisuje reguły iptables i omija ufw, więc samo "3001:3000"
    # wystawiało API na świat pod http://IP:3001 z pominięciem nginxa
    # (bez jego nagłówków, limitów i przyszłego HTTPS).
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      # BEZ TEGO: uploads/ (avatary, dokumenty — patrz src/lib/uploads.ts)
      # ląduje w zapisywalnej warstwie KONTENERA, nie hosta. "docker compose
      # down && up" (dokładnie to, co robi .github/workflows/deploy.yml
      # przy KAŻDYM deployu) usuwa stary kontener razem z tą warstwą —
      # wszystkie wgrane pliki znikają przy następnym wdrożeniu. Nazwany
      # wolumen (jak db-data niżej) przeżywa "down"/"up", bo żyje niezależnie
      # od cyklu życia kontenera.
      - uploads-data:/usr/src/app/uploads   # prawa ścieżka = WORKDIR z Dockerfile.prod + "uploads"
    depends_on:
      - db

volumes:
  db-data:       # nazwa wolumenu - dane bazy przeżywają restart kontenerów
  uploads-data:  # jw., dla avatarów/dokumentów z src/lib/uploads.ts
