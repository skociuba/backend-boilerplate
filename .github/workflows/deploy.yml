name: Deploy Backend

# Wdraża KONKRETNĄ wersję z wydania (obraz :X.Y.Z), nigdy "to, co akurat
# jest na master". Dwa wejścia, ten sam kod:
# - workflow_call: release.yml odpala to samo po utworzeniu wydania,
# - workflow_dispatch: ręcznie z zakładki Actions → "Run workflow" →
#   numer wersji. Ponowny deploy albo rollback do starszego wydania bez
#   logowania się na serwer (scripts/rollback.sh zostaje na awarie, gdy
#   GitHub Actions nie działa).
on:
  workflow_call:
    inputs:
      version:
        description: Wersja do wdrożenia, np. 1.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Wersja do wdrożenia, np. 1.2.0 (lista w zakładce Releases)
        required: true
        type: string

jobs:
  deploy:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest
    # Jeden deploy naraz, bez anulowania — przerwany w połowie (po down,
    # przed up) zostawiłby produkcję wyłączoną. Grupa na poziomie joba, bo
    # przy workflow_call ${{ github.workflow }} to nazwa wywołującego.
    concurrency:
      group: deploy-backend-production
      cancel-in-progress: false
    env:
      IMAGE: sebastiankociuba/node-backend
      VERSION: ${{ inputs.version }}
    steps:
      # Wersja z ręcznego formularza trafia do skryptu na serwerze — tylko
      # X.Y.Z, żeby literówka albo coś gorszego nie poszło do powłoki
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Niepoprawna wersja: '$VERSION' (oczekiwane X.Y.Z, np. 1.2.0)" >&2
            exit 1
          fi

      # Sprawdzenie PRZED dotknięciem serwera — brak obrazu wyszedłby
      # dopiero na pull, już po backupie
      - name: Check that the release image exists
        run: |
          if ! docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Brak obrazu $IMAGE:$VERSION w rejestrze — czy to wydanie istnieje?" >&2
            exit 1
          fi

      # docker-compose.yml i skrypty z TAGA wydania, nie z master — wdrażana
      # wersja dostaje dokładnie tę konfigurację, z którą została wydana
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,scripts/"
          target: "/var/www/backend-node"

      # Kolejność ma znaczenie: backup PRZED tym, jak cokolwiek zacznie się
      # zmieniać (żeby mieć czym się odkręcić, jeśli migracja coś popsuje) →
      # pull nowego obrazu → migrate deploy TYM obrazem na WCIĄŻ żyjącej
      # starej bazie (`docker-compose run` nie dotyka działających
      # kontenerów, tylko odpala jednorazowy, z tą samą siecią/env co
      # serwis `app`) → dopiero teraz down+up, czyli realne przełączenie.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # envs zamiast wklejania ${{ }} w skrypt: wersja dociera jako
          # zmienna środowiskowa, a nie jako fragment kodu powłoki
          envs: VERSION
          # set -e: ssh-action v0.1.x domyślnie (script_stop: false) leci dalej
          # po błędzie — nieudany migrate deploy kończyłby się down+up nowego
          # kodu na starej bazie zamiast zatrzymania deployu.
          # sudo IMAGE_TAG=...: sudo czyści środowisko, więc zmienną trzeba
          # podać mu wprost; docker-compose.yml czyta ${IMAGE_TAG:-latest}.
          # wait-healthy.sh na końcu: deploy jest zielony dopiero, gdy aplikacja
          # odpowiada na /health razem z bazą, a nie zaraz po `up -d`.
          script: |
            set -e
            cd /var/www/backend-node
            chmod +x scripts/*.sh
            echo "=== Deploy wersji $VERSION ==="
            ./scripts/backup-db.sh .
            sudo IMAGE_TAG="$VERSION" docker-compose pull
            sudo IMAGE_TAG="$VERSION" docker-compose run --rm app ./node_modules/.bin/prisma migrate deploy
            sudo IMAGE_TAG="$VERSION" docker-compose down
            sudo IMAGE_TAG="$VERSION" docker-compose up -d
            sudo ./scripts/wait-healthy.sh .
            sudo docker image prune -f
