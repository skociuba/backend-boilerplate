name: CI

# Testy i obraz dla każdego commita na master oraz każdego PR-a do master.
# NIE wdraża — produkcja idzie tylko z wydania (release.yml → deploy.yml),
# czyli po merge'u PR-a "chore(master): release X.Y.Z". Merge zwykłego
# PR-a to "gotowe do wydania", a nie "już na produkcji".
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Jeden przebieg naraz na gałąź. Na PR nowy push anuluje stary przebieg
# (liczy się tylko najnowszy commit), ale na master nie — release.yml czeka
# na obraz :sha z KAŻDEGO commita release'owego, więc przerwany build
# zostawiłby wydanie bez obrazu do wdrożenia.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Testy muszą móc zatrzymać commit, zanim powstanie obraz, który potem
  # może trafić na produkcję. Prisma w testach jest zamockowana,
  # więc baza w CI nie jest potrzebna; generate jest, bo src/generated
  # jest gitignorowany, a bez niego tsc i importy klienta się wywalają.
  test:
    # Stała nazwa joba = nazwa wymaganego checka w branch protection
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      # Znane podatności w zależnościach produkcyjnych (te, które jadą do
      # obrazu). --audit-level=high: moderate/low nie blokują PR-a, bo
      # często dotyczą ścieżek, których aplikacja nie używa — te łata
      # Dependabot (.github/dependabot.yml) w swoim tempie.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Testy na prawdziwym Postgresie: baza budowana od zera migracjami
  # (`prisma migrate deploy`, jak na produkcji), potem żądania HTTP do
  # aplikacji. Łapią to, czego testy z mockiem Prismy nie widzą: SQL,
  # transakcje, kaskady, migracje. Równolegle z `test`, żeby PR nie czekał
  # dwa razy dłużej.
  integration:
    name: integration
    runs-on: ubuntu-latest

    services:
      postgres:
        # Ta sama wersja co na produkcji (docker-compose.yml)
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vps2_test
        ports:
          - 5432:5432
        # Job czeka, aż Postgres faktycznie przyjmuje połączenia
        options: >-
          --health-cmd "pg_isready -U test -d vps2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Nazwa bazy musi zawierać "test" — inaczej testy odmówią startu
      # (src/tests/integration/setup/guard.ts)
      DATABASE_URL: postgres://test:test@localhost:5432/vps2_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run integration tests
        run: npm run test:integration

  # Na PR obraz też się buduje (zepsuty Dockerfile wychodzi przed merge'em),
  # ale nie trafia do Docker Huba. Z master idzie tylko :<sha> — :latest
  # przesuwa release.yml dopiero przy wydaniu, więc :latest = to, co jest
  # na produkcji, a nie ostatni merge.
  build:
    name: build
    needs: [test, integration]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Najpierw build do lokalnego Dockera (load), skan, dopiero potem push
      # — obraz z podatnością HIGH/CRITICAL nie trafia do rejestru, więc nie
      # da się go też wydać ani wdrożyć.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.prod
          load: true
          # Cache warstw w GitHub Actions: zmiana w kodzie nie przebudowuje od
          # zera warstwy z npm install, jeśli package-lock się nie zmienił
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: sebastiankociuba/node-backend:${{ github.sha }}

      # Trivy jako obraz przypięty do digestu, a nie aquasecurity/trivy-action
      # z tagiem: tagi tej akcji zostały w 2026 przejęte i podmienione na
      # kradnące sekrety — tag można przesunąć, digestu nie.
      # --ignore-unfixed: blokujemy tylko to, co da się naprawić (jest
      # poprawiona wersja); podatność bez łatki zablokowałaby każdy PR, a
      # nie ma czego zaktualizować.
      - name: Scan image for vulnerabilities (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "sebastiankociuba/node-backend:${{ github.sha }}"

      # Ten sam build drugi raz, ale wszystkie warstwy są już w cache, więc
      # to tylko wysłanie gotowego obrazu do rejestru
      - name: Push backend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          cache-from: type=gha
          tags: sebastiankociuba/node-backend:${{ github.sha }}
