name: Deploy Backend

# Produkcja idzie z master (jak frontend) — osobna gałąź deploy tylko
# duplikowała master i trzeba było ją ręcznie doganiać. workflow_dispatch
# pozwala odpalić deploy ponownie z zakładki Actions bez pustego commita.
# pull_request: testy i build obrazu (bez push i deployu) na każdym PR do
# master — błąd ma wyjść przed merge'em, a nie dopiero na master.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Jeden przebieg naraz na gałąź. Na PR nowy push anuluje stary przebieg
# (liczy się tylko najnowszy commit), ale na master nie — przerwany w
# połowie deploy (po down, przed up) zostawiłby produkcję wyłączoną, więc
# kolejne deploye czekają w kolejce.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skoro każdy merge do master ląduje na produkcji, testy muszą go móc
  # zatrzymać, zanim powstanie obraz. Prisma w testach jest zamockowana,
  # więc baza w CI nie jest potrzebna; generate jest, bo src/generated
  # jest gitignorowany, a bez niego tsc i importy klienta się wywalają.
  test:
    # Stała nazwa joba = nazwa wymaganego checka w branch protection
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  # Testy na prawdziwym Postgresie: baza budowana od zera migracjami
  # (`prisma migrate deploy`, jak na produkcji), potem żądania HTTP do
  # aplikacji. Łapią to, czego testy z mockiem Prismy nie widzą: SQL,
  # transakcje, kaskady, migracje. Równolegle z `test`, żeby PR nie czekał
  # dwa razy dłużej.
  integration:
    name: integration
    runs-on: ubuntu-latest

    services:
      postgres:
        # Ta sama wersja co na produkcji (docker-compose.yml)
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vps2_test
        ports:
          - 5432:5432
        # Job czeka, aż Postgres faktycznie przyjmuje połączenia
        options: >-
          --health-cmd "pg_isready -U test -d vps2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Nazwa bazy musi zawierać "test" — inaczej testy odmówią startu
      # (src/tests/integration/setup/guard.ts)
      DATABASE_URL: postgres://test:test@localhost:5432/vps2_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run integration tests
        run: npm run test:integration

  # Na PR obraz też się buduje (zepsuty Dockerfile wychodzi przed merge'em),
  # ale nie trafia do Docker Huba — :latest to zawsze wersja z master.
  build:
    name: build
    needs: [test, integration]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          # Cache warstw w GitHub Actions: zmiana w kodzie nie przebudowuje od
          # zera warstwy z npm install, jeśli package-lock się nie zmienił
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            sebastiankociuba/node-backend:latest
            sebastiankociuba/node-backend:${{ github.sha }}

  deploy:
    name: Deploy Backend to VPS
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # sql/ już nie istnieje — schemat budują migracje Prismy, nie initdb
          source: "docker-compose.yml,scripts/"
          target: "/var/www/backend-node"

      # Kolejność ma znaczenie: backup PRZED tym, jak cokolwiek zacznie się
      # zmieniać (żeby mieć czym się odkręcić, jeśli migracja coś popsuje) →
      # pull nowego obrazu → migrate deploy TYM obrazem na WCIĄŻ żyjącej
      # starej bazie (`docker-compose run` nie dotyka działających
      # kontenerów, tylko odpala jednorazowy, z tą samą siecią/env co
      # serwis `app`) → dopiero teraz down+up, czyli realne przełączenie.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # set -e: ssh-action v0.1.x domyślnie (script_stop: false) leci dalej
          # po błędzie — nieudany migrate deploy kończyłby się down+up nowego
          # kodu na starej bazie zamiast zatrzymania deployu.
          # wait-healthy.sh na końcu: deploy jest zielony dopiero, gdy aplikacja
          # odpowiada na /health razem z bazą, a nie zaraz po `up -d`.
          script: |
            set -e
            cd /var/www/backend-node
            chmod +x scripts/*.sh
            ./scripts/backup-db.sh .
            sudo docker-compose pull
            sudo docker-compose run --rm app npx prisma migrate deploy
            sudo docker-compose down
            sudo docker-compose up -d
            sudo ./scripts/wait-healthy.sh .
            sudo docker image prune -f
